name: Publish Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    # Only react to CI runs on main. Without this, every PR CI completion
    # still starts a Publish Pages run that immediately skips — and the
    # Actions UI labels those runs as head_branch=main (default branch),
    # which looks like a failed/skipped production deploy.
    branches: [main]

concurrency:
  group: pages-${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Prefer push-to-main CI only. PR workflows on main (rare) must not publish.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify (typecheck, content tests, build)
        run: npm run generate:content && npm run test:content && npm run typecheck && npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build-and-deploy
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4